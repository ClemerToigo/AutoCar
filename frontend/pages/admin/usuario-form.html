  </aside><div class="admin-content"><header class="dashboard-header"><h1 id="page-title">Cadastrar Usuário</h1><div class="header-actions"><button class="notification-button" type="button" aria-label="Notificações" data-info-title="Notificações" data-info-message="Você não tem novas notificações."><svg class="icon" aria-hidden="true"><use href="/assets/images/icones/sprite.svg#bell"/></svg><span class="notification-dot"></span></button><button id="profile-menu" class="profile-button" type="button" data-info-title="Minha conta"><span class="user-avatar" data-user-initials></span><span data-user-name></span></button></div></header><main class="dashboard-main"><p id="session-status" class="status-message" role="status" aria-live="polite">Verificando sua sessão…</p><div id="session-error" class="message message-error" role="alert" hidden></div><button id="retry-session" class="button button-secondary retry" type="button" hidden>Tentar novamente</button><section id="account-content" hidden><p id="page-notice" class="message message-success" role="status" hidden></p><p id="page-error" class="message message-error" role="alert" hidden></p><form id="record-form" class="record-form user-form"><fieldset id="form-fields"><div class="form-grid"><div class="span-two"><div class="form-field"><label for="nome">Nome completo<span class=required>*</span></label><input id="nome" name="nome" type="text" placeholder="Nome completo do usuário" required maxlength="255" autocomplete="name"></div></div><div class="form-field"><label for="cpf">CPF<span class=required>*</span></label><input id="cpf" name="cpf" type="text" placeholder="000.000.000-00" required maxlength="14" inputmode="numeric"></div><div class="form-field"><label for="telefone">Telefone<span class=required>*</span></label><input id="telefone" name="telefone" type="text" placeholder="(11) 99999-9999" required maxlength="16" inputmode="tel" autocomplete="tel"></div><div class="span-two"><div class="form-field"><label for="email">E-mail<span class=required>*</span></label><input id="email" name="email" type="email" placeholder="usuario@email.com" required maxlength="255" autocomplete="username"></div></div><div id="password-field" class="span-two form-field"><label for="senha"><span id="password-label">Senha<span class="required">*</span></span></label><input id="senha" name="senha" type="password" placeholder="••••••••" minlength="8" autocomplete="new-password" required><p id="password-note" class="field-note" hidden>Deixe em branco para manter a senha atual.</p></div><div class="form-field"><label for="tipo">Tipo de usuário<span class="required">*</span></label><select id="tipo" name="tipo" required><option value="">Selecionar…</option><option value="USUARIO">Cliente</option><option value="ADMIN">Administrador</option></select></div><div class="form-field"><label for="ativo">Status<span class="required">*</span></label><select id="ativo" name="ativo" required><option value="">Selecionar…</option><option value="true">Ativo</option><option value="false">Inativo</option></select></div></div><p id="self-note" class="field-note" hidden>Sua conta deve permanecer ativa e com perfil de administrador.</p></fieldset><div class="form-actions"><a id="cancel-record" class="button button-secondary" href="/pages/admin/usuarios.html">Cancelar</a><button id="save-record" class="button button-primary" type="submit">Salvar usuário</button></div></form></section></main></div><button class="help-button" type="button" aria-label="Ajuda" data-info-title="Cadastrar Usuário" data-info-message="Use os filtros para encontrar registros. Você pode visualizar, cadastrar, editar e excluir. Confira os dados antes de salvar; a exclusão pede confirmação.">?</button><dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><h2 id="info-title"></h2><p id="info-message"></p><form method="dialog"><button class="button button-primary">Entendi</button></form></dialog></body></html>

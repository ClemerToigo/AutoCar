<!doctype html>
<html lang="pt-BR"><head>
  <script src="/js/theme.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadastrar Serviço | AutoCar</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/crud.css"><script type="module" src="/js/admin/servico-form.js"></script><script type="module" src="/js/wireframe-ui.js"></script>  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="admin-page"><aside class="sidebar" aria-label="Painel administrativo">
    <div class="sidebar-brand"><a class="brand" href="/" aria-label="AutoCar, início"><span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="/assets/images/icones/sprite.svg#car"/></svg></span><span>AutoCar</span></a><span class="admin-caption">Painel Admin</span></div>
    <nav class="sidebar-navigation" aria-label="Menu principal" aria-busy="true"></nav>
    <div class="sidebar-settings"><a class="nav-item" href="/pages/admin/configuracoes.html"><span>Configurações</span></a></div>
    <div class="sidebar-account"><div class="sidebar-profile"><span class="user-avatar" data-user-initials></span><div><strong data-user-name></strong><span data-user-role></span></div></div><button id="logout" class="logout-button" type="button"><span aria-hidden="true">←</span><span>Sair do painel</span></button></div>
  </aside><div class="admin-content"><header class="dashboard-header"><h1 id="page-title">Cadastrar Serviço</h1><div class="header-actions"><button class="notification-button" type="button" aria-label="Notificações" data-info-title="Notificações" data-info-message="O módulo de notificações ainda não está disponível."><svg class="icon" aria-hidden="true"><use href="/assets/images/icones/sprite.svg#bell"/></svg></button><a id="profile-menu" class="profile-button" href="/pages/admin/perfil.html" aria-label="Abrir meu perfil"><span class="user-avatar" data-user-initials></span><span data-user-name></span></a></div></header><main class="dashboard-main"><p id="session-status" class="status-message" role="status" aria-live="polite">Verificando sua sessão…</p><div id="session-error" class="message message-error" role="alert" hidden></div><button id="retry-session" class="button button-secondary retry" type="button" hidden>Tentar novamente</button><section id="account-content" hidden><p id="page-notice" class="message message-success" role="status" hidden></p><p id="page-error" class="message message-error" role="alert" hidden></p><form id="record-form" class="record-form user-form"><fieldset id="form-fields"><h2 class="form-section-title">INFORMAÇÕES DO SERVIÇO</h2><div class="form-grid"><div class="form-field span-two"><label for="nome">Nome do serviço<span class="required">*</span></label><input id="nome" name="nome" type="text" placeholder="Ex: Revisão completa" required maxlength="120"></div><div class="form-field"><label for="preco">Preço (R$)<span class="required">*</span></label><input id="preco" name="preco" type="number" placeholder="0,00" required min="0" max="9999999999.99" step="0.01" inputmode="decimal"></div><div class="form-field"><label for="ativo">Status<span class="required">*</span></label><select id="ativo" name="ativo" required><option value="">Selecionar…</option><option value="true">Ativo</option><option value="false">Inativo</option></select></div><div class="form-field span-two"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" maxlength="1000" rows="4" placeholder="O que está incluído neste serviço…"></textarea></div></div></fieldset><div class="form-actions"><a id="cancel-record" class="button button-secondary" href="/pages/admin/servicos.html">Cancelar</a><button id="save-record" class="button button-primary" type="submit">Salvar serviço</button></div></form></section></main></div><button class="help-button" type="button" aria-label="Ajuda" data-info-title="Serviço" data-info-message="Informe o nome, o preço e se o serviço está ativo. O preço de vendas já registradas não muda quando o serviço é editado.">?</button><dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><h2 id="info-title"></h2><p id="info-message"></p><form method="dialog"><button class="button button-primary">Entendi</button></form></dialog></body></html>

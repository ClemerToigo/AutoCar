  </aside><div class="admin-content"><header class="dashboard-header"><h1 id="page-title">Gerenciar Veículos</h1><div class="header-actions"><button class="notification-button" type="button" aria-label="Notificações" data-info-title="Notificações" data-info-message="O módulo de notificações ainda não está disponível."><svg class="icon" aria-hidden="true"><use href="/assets/images/icones/sprite.svg#bell"/></svg></button><a id="profile-menu" class="profile-button" href="/pages/admin/perfil.html" aria-label="Abrir meu perfil"><span class="user-avatar" data-user-initials></span><span data-user-name></span></a></div></header><main class="dashboard-main"><p id="session-status" class="status-message" role="status" aria-live="polite">Verificando sua sessão…</p><div id="session-error" class="message message-error" role="alert" hidden></div><button id="retry-session" class="button button-secondary retry" type="button" hidden>Tentar novamente</button><section id="account-content" hidden><p id="page-notice" class="message message-success" role="status" hidden></p><p id="page-error" class="message message-error" role="alert" hidden></p><div class="crud-toolbar"><label class="sr-only" for="search">Pesquisar veículo</label><div class="search-control"><svg class="icon" aria-hidden="true"><use href="/assets/images/icones/sprite.svg#search"/></svg><input id="search" type="search" placeholder="Pesquisar veículo…" maxlength="120" autocomplete="off"></div><label class="sr-only" for="filter-brand">Filtrar por marca</label><select id="filter-brand"><option value="">Todas as marcas</option></select><label class="sr-only" for="filter-category">Filtrar por categoria</label><select id="filter-category"><option value="">Todas as categorias</option></select><label class="sr-only" for="filter-status">Filtrar por status</label><select id="filter-status"><option value="">Todos os status</option><option value="DISPONIVEL">Disponível</option><option value="RESERVADO">Reservado</option><option value="VENDIDO">Vendido</option></select><a class="button button-primary new-record" href="/pages/admin/veiculo-form.html">＋ Cadastrar veículo</a></div><div class="management-table-container"><table id="records-table" class="management-table vehicles-table" aria-busy="false"><caption class="sr-only">Lista de veiculos</caption><thead><tr><th scope="col">FOTO</th><th scope="col">MODELO</th><th scope="col">MARCA</th><th scope="col">CATEGORIA</th><th scope="col">ANO</th><th scope="col">QUILOMETRAGEM</th><th scope="col">PREÇO</th><th scope="col">STATUS</th><th scope="col">AÇÕES</th></tr></thead><tbody id="records-body"></tbody></table></div><p id="records-summary" class="records-summary" role="status"></p><nav id="pagination" class="pagination" aria-label="Paginação"></nav><dialog id="delete-dialog" class="info-dialog" aria-labelledby="delete-title"><h2 id="delete-title">Excluir veículo?</h2><p>Confirma a exclusão de <strong id="delete-name"></strong>? O registro será removido do AutoCar.</p><p id="delete-error" class="message message-error" role="alert" hidden></p><div class="dialog-actions"><button id="cancel-delete" class="button button-secondary" type="button">Cancelar</button><button id="confirm-delete" class="button button-primary" type="button">Excluir veículo</button></div></dialog></section></main></div><button class="help-button" type="button" aria-label="Ajuda" data-info-title="Gerenciar Veículos" data-info-message="Use os filtros para encontrar registros. Você pode visualizar, cadastrar, editar e excluir. Confira os dados antes de salvar; a exclusão pede confirmação.">?</button><dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><h2 id="info-title"></h2><p id="info-message"></p><form method="dialog"><button class="button button-primary">Entendi</button></form></dialog></body></html>

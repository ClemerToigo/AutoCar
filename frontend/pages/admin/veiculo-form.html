  </aside><div class="admin-content"><header class="dashboard-header"><h1 id="page-title">Cadastrar Veículo</h1><div class="header-actions"><button class="notification-button" type="button" aria-label="Notificações" data-info-title="Notificações" data-info-message="Você não tem novas notificações."><svg class="icon" aria-hidden="true"><use href="/assets/images/icones/sprite.svg#bell"/></svg><span class="notification-dot"></span></button><button id="profile-menu" class="profile-button" type="button" data-info-title="Minha conta"><span class="user-avatar" data-user-initials></span><span data-user-name></span></button></div></header><main class="dashboard-main"><p id="session-status" class="status-message" role="status" aria-live="polite">Verificando sua sessão…</p><div id="session-error" class="message message-error" role="alert" hidden></div><button id="retry-session" class="button button-secondary retry" type="button" hidden>Tentar novamente</button><section id="account-content" hidden><p id="page-notice" class="message message-success" role="status" hidden></p><p id="page-error" class="message message-error" role="alert" hidden></p><form id="record-form" class="record-form vehicle-form" enctype="multipart/form-data"><fieldset id="form-fields"><section class="photo-section"><h2>FOTO DO VEÍCULO</h2><div class="main-photo-row"><img id="main-photo" src="/assets/images/veiculos/sem-foto.svg" alt="Foto principal do veículo"><div id="upload-controls"><button id="choose-main" class="button button-secondary" type="button">Alterar foto principal</button><p class="field-note">JPG, PNG ou WEBP. Máx. 5 MB.</p><button id="remove-main" class="text-link" type="button" hidden>Remover foto principal</button></div></div><input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden><h2>GALERIA DE FOTOS</h2><div class="gallery-area"><div id="gallery-list" class="gallery-list"></div><button id="add-gallery" class="gallery-add" type="button">+ Adicionar</button></div><input id="gallery-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><p class="field-note gallery-note">Até 6 fotos na galeria.</p></section><h2 class="form-section-title">INFORMAÇÕES DO VEÍCULO</h2><div class="form-grid"><div class="form-field"><label for="marca_id">Marca<span class="required">*</span></label><select id="marca_id" name="marca_id" required><option value="">Selecionar…</option></select></div><div class="form-field"><label for="modelo">Modelo<span class=required>*</span></label><input id="modelo" name="modelo" type="text" placeholder="Ex: Corolla Cross" required maxlength="120"></div><div class="form-field"><label for="categoria_id">Categoria<span class="required">*</span></label><select id="categoria_id" name="categoria_id" required><option value="">Selecionar…</option></select></div><div class="form-field"><label for="ano">Ano<span class=required>*</span></label><input id="ano" name="ano" type="number" placeholder="2024" required min="1886" max="2200" step="1"></div><div class="form-field"><label for="quilometragem">Quilometragem<span class=required>*</span></label><input id="quilometragem" name="quilometragem" type="number" placeholder="0" required min="0" max="9999999" step="1"></div><div class="form-field"><label for="preco">Preço (R$)<span class=required>*</span></label><input id="preco" name="preco" type="number" placeholder="0,00" required min="0.01" max="9999999999.99" step="0.01" inputmode="decimal"></div><div class="form-field"><label for="combustivel">Combustível<span class="required">*</span></label><select id="combustivel" name="combustivel" required><option value="">Selecionar…</option><option value="Gasolina">Gasolina</option><option value="Etanol">Etanol</option><option value="Flex">Flex</option><option value="Diesel">Diesel</option><option value="Elétrico">Elétrico</option><option value="Híbrido">Híbrido</option></select></div><div class="form-field"><label for="cambio">Câmbio<span class="required">*</span></label><select id="cambio" name="cambio" required><option value="">Selecionar…</option><option value="Manual">Manual</option><option value="Automático">Automático</option><option value="CVT">CVT</option></select></div><div class="form-field"><label for="cor">Cor<span class=required>*</span></label><input id="cor" name="cor" type="text" placeholder="Ex: Branco Pérola" required maxlength="80"></div><div class="form-field"><label for="status">Status<span class="required">*</span></label><select id="status" name="status" required><option value="">Selecionar…</option><option value="DISPONIVEL">Disponível</option><option value="RESERVADO">Reservado</option><option value="VENDIDO">Vendido</option></select></div><div class="form-field span-two"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" maxlength="5000" rows="4" placeholder="Descreva o veículo, histórico de manutenção, características…"></textarea></div></div></fieldset><div class="form-actions"><a id="cancel-record" class="button button-secondary" href="/pages/admin/veiculos.html">Cancelar</a><button id="save-record" class="button button-primary" type="submit">Salvar veículo</button></div></form></section></main></div><button class="help-button" type="button" aria-label="Ajuda" data-info-title="Cadastrar Veículo" data-info-message="Use os filtros para encontrar registros. Você pode visualizar, cadastrar, editar e excluir. Confira os dados antes de salvar; a exclusão pede confirmação.">?</button><dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><h2 id="info-title"></h2><p id="info-message"></p><form method="dialog"><button class="button button-primary">Entendi</button></form></dialog></body></html>

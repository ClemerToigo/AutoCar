  </aside><div class="admin-content"><header class="dashboard-header"><h1 id="page-title">Gerenciar Vendas</h1><div class="header-actions"><button class="notification-button" type="button" aria-label="Notificações" data-info-title="Notificações" data-info-message="O módulo de notificações ainda não está disponível."><svg class="icon" aria-hidden="true"><use href="/assets/images/icones/sprite.svg#bell"/></svg></button><a id="profile-menu" class="profile-button" href="/pages/admin/perfil.html" aria-label="Abrir meu perfil"><span class="user-avatar" data-user-initials></span><span data-user-name></span></a></div></header><main class="dashboard-main"><p id="session-status" class="status-message" role="status" aria-live="polite">Verificando sua sessão…</p><div id="session-error" class="message message-error" role="alert" hidden></div><button id="retry-session" class="button button-secondary retry" type="button" hidden>Tentar novamente</button><section id="account-content" hidden><p id="page-notice" class="message message-success" role="status" hidden></p><p id="page-error" class="message message-error" role="alert" hidden></p><div class="crud-toolbar"><label class="sr-only" for="search">Pesquisar venda</label><div class="search-control"><svg class="icon" aria-hidden="true"><use href="/assets/images/icones/sprite.svg#search"/></svg><input id="search" type="search" placeholder="Pesquisar venda…" maxlength="120" autocomplete="off"></div><label class="sr-only" for="filter-period">Filtrar por período</label><select id="filter-period"><option value="">Todo o período</option><option value="30">Últimos 30 dias</option><option value="mes">Este mês</option><option value="ano">Este ano</option></select><label class="sr-only" for="filter-status">Filtrar por status</label><select id="filter-status"><option value="">Todos os status</option><option value="EM_NEGOCIACAO">Em negociação</option><option value="APROVADA">Aprovada</option><option value="CONCLUIDA">Concluída</option><option value="CANCELADA">Cancelada</option></select><a class="button button-primary new-record" href="/pages/admin/venda-form.html">＋ Nova venda</a></div><div class="management-table-container"><table id="records-table" class="management-table vendas-table" aria-busy="false"><caption class="sr-only">Lista de vendas</caption><thead><tr><th scope="col">Nº VENDA</th><th scope="col">CLIENTE</th><th scope="col">VEÍCULO</th><th scope="col">DATA</th><th scope="col">VALOR</th><th scope="col">PAGAMENTO</th><th scope="col">STATUS</th><th scope="col">AÇÕES</th></tr></thead><tbody id="records-body"></tbody></table></div><p id="records-summary" class="records-summary" role="status"></p><nav id="pagination" class="pagination" aria-label="Paginação"></nav><dialog id="delete-dialog" class="info-dialog" aria-labelledby="delete-title"><h2 id="delete-title">Cancelar venda?</h2><p>Confirma o cancelamento da venda <strong id="delete-name"></strong>? O registro continua no histórico e o veículo volta a ficar disponível.</p><p id="delete-error" class="message message-error" role="alert" hidden></p><div class="dialog-actions"><button id="cancel-delete" class="button button-secondary" type="button">Voltar</button><button id="confirm-delete" class="button button-primary" type="button">Cancelar venda</button></div></dialog></section></main></div><button class="help-button" type="button" aria-label="Ajuda" data-info-title="Gerenciar Vendas" data-info-message="Pesquise por número, cliente ou veículo e filtre por período e status. Cancelar uma venda mantém o histórico e libera o veículo. Vendas canceladas só podem ser visualizadas.">?</button><dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><h2 id="info-title"></h2><p id="info-message"></p><form method="dialog"><button class="button button-primary">Entendi</button></form></dialog></body></html>

<!doctype html>
<html lang="pt-BR"><head>
  <script src="/js/theme.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registrar Venda | AutoCar</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/crud.css"><link rel="stylesheet" href="/css/vendas.css"><script type="module" src="/js/admin/venda-form.js"></script><script type="module" src="/js/wireframe-ui.js"></script>  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="admin-page"><aside class="sidebar" aria-label="Painel administrativo">
    <div class="sidebar-brand"><a class="brand" href="/" aria-label="AutoCar, início"><span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="/assets/images/icones/sprite.svg#car"/></svg></span><span>AutoCar</span></a><span class="admin-caption">Painel Admin</span></div>
    <nav class="sidebar-navigation" aria-label="Menu principal" aria-busy="true"></nav>
    <div class="sidebar-settings"><a class="nav-item" href="/pages/admin/configuracoes.html"><span>Configurações</span></a></div>
    <div class="sidebar-account"><div class="sidebar-profile"><span class="user-avatar" data-user-initials></span><div><strong data-user-name></strong><span data-user-role></span></div></div><button id="logout" class="logout-button" type="button"><span aria-hidden="true">←</span><span>Sair do painel</span></button></div>
  </aside><div class="admin-content"><header class="dashboard-header"><h1 id="page-title">Registrar Venda</h1><div class="header-actions"><button class="notification-button" type="button" aria-label="Notificações" data-info-title="Notificações" data-info-message="O módulo de notificações ainda não está disponível."><svg class="icon" aria-hidden="true"><use href="/assets/images/icones/sprite.svg#bell"/></svg></button><a id="profile-menu" class="profile-button" href="/pages/admin/perfil.html" aria-label="Abrir meu perfil"><span class="user-avatar" data-user-initials></span><span data-user-name></span></a></div></header><main class="dashboard-main"><p id="session-status" class="status-message" role="status" aria-live="polite">Verificando sua sessão…</p><div id="session-error" class="message message-error" role="alert" hidden></div><button id="retry-session" class="button button-secondary retry" type="button" hidden>Tentar novamente</button><section id="account-content" hidden><p id="page-notice" class="message message-success" role="status" hidden></p><p id="page-error" class="message message-error" role="alert" hidden></p><form id="record-form" class="record-form sale-form"><fieldset id="form-fields"><h2 class="form-section-title">DADOS DA VENDA</h2><div class="form-grid"><div class="form-field span-two"><label for="cliente_id">Cliente<span class="required">*</span></label><select id="cliente_id" name="cliente_id" required><option value="">Selecionar…</option></select></div><div class="form-field span-two"><label for="veiculo_id">Veículo<span class="required">*</span></label><select id="veiculo_id" name="veiculo_id" required><option value="">Selecionar…</option></select><p id="vehicle-note" class="field-note" hidden>O veículo de uma venda não pode ser trocado. Para vender outro, cancele esta venda e registre uma nova.</p></div><div class="form-field span-two"><label for="valor_veiculo">Valor do veículo (R$)<span class="required">*</span></label><input id="valor_veiculo" name="valor_veiculo" type="number" placeholder="0,00" required min="0.01" max="9999999999.99" step="0.01" inputmode="decimal"></div></div><h2 class="form-section-title sale-section">SERVIÇOS ADICIONAIS</h2><div id="service-options" class="service-options"></div><div class="form-grid"><div class="form-field span-two"><label for="forma_pagamento">Forma de pagamento<span class="required">*</span></label><select id="forma_pagamento" name="forma_pagamento" required><option value="">Selecionar…</option><option value="A_VISTA">À vista</option><option value="FINANCIAMENTO">Financiamento</option><option value="CARTAO">Cartão</option></select></div><div class="form-field "><label for="valor_servicos">Valor dos serviços (R$)</label><input id="valor_servicos" type="text" value="R$ 0,00" readonly></div><div class="form-field "><label for="valor_total">Valor total (R$)</label><input id="valor_total" type="text" value="R$ 0,00" readonly></div><div class="form-field span-two"><label for="status">Status da venda<span class="required">*</span></label><select id="status" name="status" required><option value="">Selecionar…</option><option value="EM_NEGOCIACAO">Em negociação</option><option value="APROVADA">Aprovada</option><option value="CONCLUIDA">Concluída</option><option value="CANCELADA">Cancelada</option></select></div></div></fieldset><div class="form-actions"><a id="cancel-record" class="button button-secondary" href="/pages/admin/vendas.html">Cancelar</a><button id="save-record" class="button button-primary" type="submit">Finalizar venda</button></div></form></section></main></div><button class="help-button" type="button" aria-label="Ajuda" data-info-title="Registrar Venda" data-info-message="Escolha o cliente e o veículo, marque os serviços adicionais e informe a forma de pagamento. O total é calculado automaticamente. O status do veículo acompanha o status da venda.">?</button><dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><h2 id="info-title"></h2><p id="info-message"></p><form method="dialog"><button class="button button-primary">Entendi</button></form></dialog></body></html>

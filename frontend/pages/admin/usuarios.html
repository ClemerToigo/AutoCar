ovo usuário</a></div><div class="management-table-container"><table id="records-table" class="management-table users-table" aria-busy="false"><caption class="sr-only">Lista de usuarios</caption><thead><tr><th scope="col">NOME</th><th scope="col">E-MAIL</th><th scope="col">TELEFONE</th><th scope="col">TIPO</th><th scope="col">STATUS</th><th scope="col">CADASTRO</th><th scope="col">AÇÕES</th></tr></thead><tbody id="records-body"></tbody></table></div><p id="records-summary" class="records-summary" role="status"></p><nav id="pagination" class="pagination" aria-label="Paginação"></nav><dialog id="delete-dialog" class="info-dialog" aria-labelledby="delete-title"><h2 id="delete-title">Excluir usuário?</h2><p>Confirma a exclusão de <strong id="delete-name"></strong>? O registro será removido do AutoCar.</p><p id="delete-error" class="message message-error" role="alert" hidden></p><div class="dialog-actions"><button id="cancel-delete" class="button button-secondary" type="button">Cancelar</button><button id="confirm-delete" class="button button-primary" type="button">Excluir usuário</button></div></dialog></section></main></div><button class="help-button" type="button" aria-label="Ajuda" data-info-title="Gerenciar Usuários" data-info-message="Use os filtros para encontrar registros. Você pode visualizar, cadastrar, editar e excluir. Confira os dados antes de salvar; a exclusão pede confirmação.">?</button><dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><h2 id="info-title"></h2><p id="info-message"></p><form method="dialog"><button class="button button-primary">Entendi</button></form></dialog></body></html>
